name: chain-probe
on:
  push:
    branches: [chain-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run round 4 probe
        working-directory: probe
        run: node round4.mjs
      - name: Commit results
        run: |
          git config user.name "chain-probe-bot"
          git config user.email "actions@github.com"
          git add probe/out probe/out2 probe/out3 probe/out4
          git commit -m "chain-probe round 4 results [skip ci]" || echo "nothing to commit"
          git push origin HEAD:chain-probe
